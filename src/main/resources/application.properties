spring.application.name=back

spring.profiles.active=dev
# Se quiser mais log do security:
logging.level.org.springframework.security=DEBUG



server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/germinai
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
# Modo: mock (apenas loga no console) ou smtp (envia email real)
app.email.mode=${EMAIL_MODE:mock}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha-de-app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application URL for reset password link
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.password.reset.token.expiration=3600000

